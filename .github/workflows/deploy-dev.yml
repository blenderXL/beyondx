name: Deploy · dev

on:
  push:
    branches: [master]

# Vercel handles the app deploy via its own GitHub integration.
# This workflow's only job is applying database migrations to nzx-dev.
jobs:
  migrate-dev:
    name: Apply migrations · nzx-dev
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-dev
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_DEV_PROJECT_REF }}"
      - name: Apply migrations
        run: supabase db push --linked --include-all
