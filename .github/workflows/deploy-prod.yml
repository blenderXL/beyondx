name: Deploy · production

on:
  release:
    types: [published]

# Two-stage prod deploy:
#  1) Apply migrations to nzx-prod (gated by `production` environment approval).
#  2) Build + deploy the app to Vercel production (also gated).
#
# Vercel's GitHub integration is configured (in the project settings) to deploy
# only Preview builds for master/branch pushes — never Production. Production
# deploys happen exclusively from this workflow via the Vercel CLI.
jobs:
  migrate-prod:
    name: Apply migrations · nzx-prod
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROD_PROJECT_REF }}"
      - name: Apply migrations
        run: supabase db push --linked --include-all

  deploy-prod:
    name: Build + deploy · Vercel production
    runs-on: ubuntu-latest
    needs: migrate-prod
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build (prebuilt for prod)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt artifact to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
