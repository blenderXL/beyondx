name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Org policy locks GITHUB_TOKEN out of creating PRs, so release-please
          # authenticates with a scoped fine-grained PAT instead (Contents +
          # Pull requests: write on this repo). See SETUP.md "release-please".
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master
